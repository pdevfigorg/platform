{{ if .Values.gateway.nginxGateway }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "myapp.fullname" . }}-httproute
  labels: 
    {{- include "myapp.labels" . | nindent 4 }}
    app.kubernetes.io/name: myapp
    app.kubernetes.io/component: httproute
spec:
  parentRefs: 
    - name: {{ include "myapp.fullname" . }}-gateway
  rules:
    # frontend
    - matches:
        - path:
            type: {{ .Values.httpRoute.rules.frontend.path.pathType }}
            value: {{ .Values.httpRoute.rules.frontend.path.value }}
      backendRefs:
        - name: {{ include "myapp.fullname" . }}-frontend
          port: {{ .Values.frontend.service.port }}

    # backend
    - matches:
        - path:
            type: {{ .Values.httpRoute.rules.backend.path.pathType }}
            value: {{ .Values.httpRoute.rules.backend.path.value }}
      backendRefs:
        - name: {{ include "myapp.fullname" . }}-backend
          port: {{ .Values.backend.service.port }}
      filters:
        {{- toYaml .Values.httpRoute.rules.backend.filter | nindent 8 }}
{{- end }} 