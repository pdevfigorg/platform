name: test-dispatch
on:
  workflow_dispatch:
    inputs:
      number:
        required: true
        type: number
      

jobs:
  print-to-summary:
    runs-on: ubuntu-latest
    steps:
      - name: echo to github step summary
        run: |
          cat > preview.md <<EOF
          " Preview environment "
          ""
          "Preview: https://pr-${{ inputs.number }}.myapp.example.com"
          EOF
          cat preview.md >> "GITHUB_STEP_SUMMARY"
      - name: echo with clikable
        run: |
          echo " Preview environment " >> "$GITHUB_STEP_SUMMARY"
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[Open Preview](Preview: https://pr-${{ inputs.number }}.myapp.example.com)" >> "GITHUB_STEP_SUMMARY"
  second-job:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Web UI Summary
        run: |
          cat << 'EOF' >> $GITHUB_STEP_SUMMARY
          ### 🚀 Deployment Status
          The build was successful!
          
          - **Version:** 1.2.0
          - **Environment:** Production
          
          | Metric | Value | Status |
          | --- | --- | --- |
          | Code Coverage | 92% | ✅ |
          | Bundled Size | 1.4 MB | ⚠️ |
          EOF

